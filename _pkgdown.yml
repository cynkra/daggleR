url: https://cynkra.github.io/daggleR/

template:
  bootstrap: 5
  light-switch: true
  bslib:
    # Light mode — Canopy Green palette
    primary: "#2F5D50"
    secondary: "#1E2D24"
    bg: "#F2F5F3"
    fg: "#1E2D24"
    base_font:
      google: Inter
    heading_font:
      google: Cinzel
    code_font:
      google: JetBrains Mono
  includes:
    in_header: <link rel="icon" type="image/x-icon" href="favicon/favicon.ico">

navbar:
  bg: "#2F5D50"
  type: dark
  structure:
    left: [intro, reference, articles]
    right: [search, github, lightswitch]
  components:
    github:
      icon: fa-github
      href: https://github.com/cynkra/daggleR
      aria-label: GitHub

home:
  title: daggleR
  description: >
    Companion R package for daggle, a lightweight DAG scheduler for R.
  strip_header: true

footer:
  structure:
    left: developed_by
    right: built_with

reference:
  - title: In-step helpers
    desc: >
      Functions for use inside R steps executed by daggle.
      No network access or daggle binary needed.
    contents:
      - daggle_output
      - daggle_run_id
      - daggle_dag_name
      - daggle_run_dir
      - daggle_get_matrix
      - daggle_get_output
      - daggle_summary_md
      - daggle_meta_numeric
      - daggle_meta_text
      - daggle_meta_table
      - daggle_meta_image
      - daggle_validation

  - title: DAG management
    desc: List and inspect DAGs.
    contents:
      - daggle_list_dags
      - daggle_get_dag
      - daggle_plan
      - daggle_get_impact
      - daggle_init_dag

  - title: Run management
    desc: Trigger, inspect, and cancel DAG runs.
    contents:
      - daggle_trigger
      - daggle_list_runs
      - daggle_get_run
      - daggle_get_outputs
      - daggle_get_step_log
      - daggle_cancel_run
      - daggle_compare_runs
      - daggle_list_artifacts
      - daggle_get_summaries
      - daggle_get_metadata
      - daggle_get_validations
      - daggle_list_annotations
      - daggle_add_annotation

  - title: Approval gates
    desc: Approve or reject waiting steps.
    contents:
      - daggle_approve
      - daggle_reject

  - title: Schedules
    desc: List and manage runtime schedules.
    contents:
      - daggle_list_schedules
      - daggle_add_schedule
      - daggle_remove_schedule
      - daggle_set_schedule_enabled

  - title: Archives
    desc: Create, verify, and download tamper-evident run archives.
    contents:
      - daggle_archive_info
      - daggle_verify_archive
      - daggle_archive_run

  - title: Project management
    desc: Register and unregister projects.
    contents:
      - daggle_list_projects
      - daggle_register_project
      - daggle_unregister_project

  - title: System
    desc: Health checks, cleanup, and diagnostics.
    contents:
      - daggle_health
      - daggle_cleanup
      - daggle_cli_version
      - daggle_lint
